# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/otlp)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add AWS IAM database authentication support via a new `db_auth` config block, so the receiver can connect to RDS/Aurora with short-lived IAM tokens instead of a static password.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [48725]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Enable the aws_iam credentials provider extension (region, optional role_arn) and
  reference it from the receiver with a `db_auth` block keyed by the provider's
  component ID (`db_auth: { aws_iam: {} }`), optionally overriding a provider default
  such as `region` inline; the receiver supplies its endpoint and username to the
  provider, so they are not repeated. The token is minted on demand and refreshed
  before expiry; the receiver re-resolves it on each new connection, so it composes
  with the connection_pool feature gate (a pooled connection re-mints when opened,
  never dialing with an expired token). Mutually exclusive with the static `password`
  field. Built on the new db_auth framework (extension/dbauth and config/configdbauth).

